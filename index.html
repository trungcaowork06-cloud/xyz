<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>📁 Vault - Kho lưu trữ cá nhân</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --bg-primary: #0b0f19;
      --bg-secondary: #151b28;
      --bg-card: #1e2538;
      --text-primary: #eef2f7;
      --text-secondary: #9aa4bf;
      --accent: #4f8cff;
      --danger: #f87171;
      --border: rgba(255,255,255,0.08);
      --radius: 1rem;
    }
    body {
      font-family: 'Inter', 'Segoe UI', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .app-layout { display: flex; flex: 1; overflow: hidden; }
    .sidebar {
      width: 280px;
      background: rgba(18,24,40,0.95);
      backdrop-filter: blur(16px);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 1.5rem 1rem;
      z-index: 30;
      transition: transform 0.3s;
    }
    @media (max-width: 768px) {
      .sidebar {
        position: fixed; top:0; left:0; bottom:0;
        transform: translateX(-100%);
        box-shadow: 2px 0 20px rgba(0,0,0,0.5);
      }
      .sidebar.open { transform: translateX(0); }
      .mobile-menu-btn {
        display: flex !important;
        position: fixed; top: 1rem; left: 1rem;
        z-index: 40;
        background: var(--bg-card); border-radius: 50%;
        width: 42px; height: 42px;
        align-items: center; justify-content: center;
        cursor: pointer; color: white;
        font-size: 1.4rem; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      }
    }
    .mobile-menu-btn { display: none; }
    .sidebar-header { font-size: 1.5rem; font-weight: 700; margin-bottom: 2rem; display: flex; align-items: center; gap: 0.5rem; justify-content: space-between; }
    .sidebar-close-mobile { display: none; background: none; border: none; color: white; font-size: 1.5rem; cursor: pointer; }
    @media (max-width: 768px) { .sidebar-close-mobile { display: block; } }
    .nav-menu { display: flex; flex-direction: column; gap: 0.3rem; }
    .nav-item {
      display: flex; align-items: center; gap: 0.8rem;
      padding: 0.8rem 1rem; border-radius: 0.9rem;
      cursor: pointer; color: var(--text-secondary);
      font-weight: 500; transition: 0.15s;
    }
    .nav-item:hover { background: rgba(255,255,255,0.05); color: white; }
    .nav-item.active { background: var(--accent); color: white; }
    .folders-section { margin-top: 1.5rem; flex:1; overflow-y:auto; }
    .folders-title { color: var(--text-secondary); font-size: 0.8rem; text-transform: uppercase; margin-bottom: 0.5rem; }
    .folder-list { display: flex; flex-direction: column; gap: 0.2rem; }
    .folder-item {
      display: flex; align-items: center; gap: 0.5rem;
      padding: 0.6rem 0.8rem; border-radius: 0.7rem;
      cursor: pointer; color: var(--text-secondary);
      position: relative; transition: 0.15s;
    }
    .folder-item i { color: #fbbf24; }
    .folder-item.active { background: rgba(79,140,255,0.15); color: white; }
    .folder-item .folder-actions { display: none; margin-left: auto; gap: 0.3rem; }
    .folder-item:hover .folder-actions { display: flex; }
    .folder-item .folder-actions button { background: none; border: none; color: var(--text-secondary); cursor: pointer; padding: 0.2rem 0.3rem; border-radius: 0.3rem; }
    .folder-item .folder-actions button:hover { color: white; background: rgba(255,255,255,0.1); }
    .add-folder { display: flex; gap: 0.5rem; margin-top: 0.5rem; }
    .add-folder input { flex:1; padding:0.5rem; background: var(--bg-card); border:1px solid var(--border); border-radius:0.6rem; color:white; outline:none; }
    .add-folder button { padding:0.5rem 0.8rem; background: var(--accent); border:none; border-radius:0.6rem; color:white; cursor:pointer; }
    .sidebar-footer { margin-top: auto; border-top:1px solid var(--border); padding-top:1rem; display: flex; align-items: center; gap: 0.5rem; color: var(--text-secondary); }
    .logout-btn-sidebar { margin-left: auto; color: var(--danger); cursor: pointer; }

    .main-content { flex:1; overflow-y:auto; padding: 2rem; background: var(--bg-secondary); -webkit-overflow-scrolling: touch; }
    @media (max-width: 768px) {
      .main-content { padding: 1rem; padding-top: calc(1rem + 60px); padding-bottom: 5rem; }
    }
    .page { display: none; animation: fade 0.2s; }
    .page.active { display: block; }
    @keyframes fade { from { opacity:0; transform: translateY(5px); } }

    .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 0.8rem; margin-top: 1rem; }
    @media (max-width: 768px) { .gallery { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 0.5rem; } }
    .media-card {
      position: relative; border-radius: 1rem; overflow: hidden;
      background: var(--bg-card); border: 1px solid var(--border);
      cursor: pointer; transition: transform 0.15s;
    }
    .media-card:active { transform: scale(0.97); }
    .media-card img { width: 100%; height: 200px; object-fit: cover; display: block; }
    @media (max-width: 768px) { .media-card img { height: 160px; } }
    .media-card .delete-btn {
      position: absolute; top: 8px; right: 8px;
      background: rgba(0,0,0,0.6); color: white;
      border: none; border-radius: 50%; width: 30px; height: 30px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; z-index: 2; opacity: 0; transition: opacity 0.2s;
    }
    .media-card:hover .delete-btn, .media-card:active .delete-btn { opacity: 1; }
    @media (max-width: 768px) { .media-card .delete-btn { opacity: 1; } }
    .media-card .media-type-icon {
      position: absolute; bottom: 8px; right: 8px;
      background: rgba(0,0,0,0.7); color: white;
      border-radius: 50%; width: 26px; height: 26px;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.8rem; z-index: 2;
    }
    .media-card.video-thumb .media-type-icon { display: flex; }
    .media-card.image-thumb .media-type-icon { display: none; }

    .upload-zone {
      border: 2px dashed rgba(255,255,255,0.2); border-radius: 1.2rem;
      padding: 2rem; text-align: center; margin: 1rem 0;
      cursor: pointer; transition: 0.2s;
    }
    .upload-zone:hover { border-color: var(--accent); }
    .file-list { margin: 0.5rem 0; color: var(--text-secondary); max-height: 150px; overflow-y: auto; font-size: 0.9rem; }
    .progress-bar { width: 100%; height: 4px; background: rgba(255,255,255,0.1); border-radius: 4px; margin-top: 0.2rem; }
    .progress-bar .progress { height: 100%; background: var(--accent); border-radius: 4px; width: 0%; transition: width 0.2s; }

    .filter-tabs { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .filter-tab {
      padding: 0.4rem 1rem; border-radius: 2rem;
      background: rgba(255,255,255,0.05); cursor: pointer;
      color: var(--text-secondary); font-size: 0.9rem;
    }
    .filter-tab.active { background: var(--accent); color: white; }

    .folder-tabs-desktop { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .folder-tab { padding: 0.4rem 1rem; border-radius: 2rem; background: rgba(255,255,255,0.05); cursor: pointer; color: var(--text-secondary); }
    .folder-tab.active { background: var(--accent); color: white; }
    @media (max-width: 768px) { .folder-tabs-desktop { display: none; } }
    .folder-select-mobile { display: none; width: 100%; padding: 0.8rem; background: var(--bg-card); border: 1px solid var(--border); border-radius: 0.8rem; color: white; margin-bottom: 1rem; font-size: 1rem; }
    @media (max-width: 768px) { .folder-select-mobile { display: block; } }

    .bottom-nav {
      display: none; background: var(--bg-secondary);
      border-top: 1px solid var(--border); padding: 0.5rem;
      justify-content: space-around; position: fixed;
      bottom:0; left:0; right:0; z-index: 25;
    }
    @media (max-width: 768px) { .bottom-nav { display: flex; } .main-content { padding-bottom: 5rem; } }
    .bottom-nav .nav-item { flex-direction: column; font-size: 0.7rem; color: var(--text-secondary); background: transparent; box-shadow: none; display: flex; align-items: center; gap: 0.2rem; }
    .bottom-nav .nav-item.active { color: var(--accent); }

    .viewer-overlay {
      position: fixed; top:0; left:0; width:100%; height:100%;
      background: rgba(0,0,0,0.96); z-index: 100;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity 0.25s;
    }
    .viewer-overlay.active { opacity: 1; pointer-events: auto; }
    .viewer-content { width:100%; height:100%; display: flex; align-items: center; justify-content: center; position: relative; }
    .viewer-media { max-width:95%; max-height:90%; object-fit: contain; border-radius:0.5rem; user-select:none; -webkit-user-select:none; transition: transform 0.2s ease-out; }
    .viewer-close { position: absolute; top:20px; right:20px; background: rgba(0,0,0,0.6); color: white; border: none; font-size:2rem; width:46px; height:46px; border-radius:50%; cursor: pointer; z-index:5; display: flex; align-items: center; justify-content: center; }
    .viewer-nav { position: absolute; top:50%; transform: translateY(-50%); background: rgba(255,255,255,0.25); color: white; border: none; font-size:2rem; padding:0.4rem 0.8rem; cursor: pointer; border-radius:0.5rem; z-index:5; transition: opacity 0.3s; opacity: 0; }
    .viewer-overlay.interacting .viewer-nav { opacity: 1; }
    .viewer-prev { left:10px; } .viewer-next { right:10px; }
    .viewer-counter { position: absolute; bottom:20px; left:50%; transform: translateX(-50%); background: rgba(0,0,0,0.6); color: white; padding:0.3rem 0.8rem; border-radius:1rem; font-size:0.9rem; }
    .hidden { display: none !important; }
    .error-msg { color: var(--danger); font-size: 0.85rem; min-height: 1.2rem; }
    .auth-container { display:flex; align-items:center; justify-content:center; height:100vh; background:radial-gradient(circle at top, #1e293b, #0b0f19); }
    .upload-status { white-space: pre-line; }
  </style>
</head>
<body>
<div class="mobile-menu-btn" id="mobileMenuBtn"><i class="fas fa-bars"></i></div>

<div id="authPage" class="auth-container">
  <div class="auth-box" id="loginForm" style="background:rgba(30,37,56,0.9); backdrop-filter:blur(20px); border:1px solid var(--border); padding:2.5rem; border-radius:2rem; width:90%; max-width:400px; box-shadow:0 15px 30px rgba(0,0,0,0.5);">
    <h2><i class="fas fa-lock"></i> Đăng nhập</h2>
    <input type="text" id="loginUsername" placeholder="Tên đăng nhập" autocomplete="off">
    <input type="password" id="loginPassword" placeholder="Mật khẩu">
    <button id="loginBtn"><i class="fas fa-sign-in-alt"></i> Đăng nhập</button>
    <div class="auth-toggle" style="color:var(--text-secondary);">Chưa có tài khoản? <span id="showRegister" style="color:var(--accent);">Đăng ký</span></div>
    <div id="loginError" class="error-msg"></div>
  </div>
  <div class="auth-box hidden" id="registerForm" style="background:rgba(30,37,56,0.9); backdrop-filter:blur(20px); border:1px solid var(--border); padding:2.5rem; border-radius:2rem; width:90%; max-width:400px; box-shadow:0 15px 30px rgba(0,0,0,0.5);">
    <h2><i class="fas fa-user-plus"></i> Đăng ký</h2>
    <input type="text" id="regUsername" placeholder="Tên đăng nhập">
    <input type="password" id="regPassword" placeholder="Mật khẩu (≥ 4 ký tự)">
    <input type="password" id="regConfirm" placeholder="Xác nhận mật khẩu">
    <button id="registerBtn"><i class="fas fa-check"></i> Tạo tài khoản</button>
    <div class="auth-toggle" style="color:var(--text-secondary);">Đã có tài khoản? <span id="showLogin" style="color:var(--accent);">Đăng nhập</span></div>
    <div id="registerError" class="error-msg"></div>
  </div>
</div>

<div id="appMain" class="hidden" style="display:flex; flex-direction:column; height:100vh;">
  <div class="app-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span><i class="fas fa-cloud-upload-alt"></i> Vault</span>
        <button class="sidebar-close-mobile" id="sidebarCloseMobile"><i class="fas fa-times"></i></button>
      </div>
      <nav class="nav-menu">
        <div class="nav-item active" data-page="library"><i class="fas fa-images"></i> Thư viện</div>
        <div class="nav-item" data-page="upload"><i class="fas fa-upload"></i> Tải lên</div>
      </nav>
      <div class="folders-section">
        <div class="folders-title">📁 Thư mục</div>
        <div class="folder-list" id="folderList"></div>
        <div class="add-folder">
          <input type="text" id="newFolderName" placeholder="Thư mục mới...">
          <button id="createFolderBtn"><i class="fas fa-plus"></i></button>
        </div>
      </div>
      <div class="sidebar-footer">
        <i class="fas fa-user-circle"></i> <span id="displayUser"></span>
        <div class="logout-btn-sidebar" id="logoutBtn"><i class="fas fa-sign-out-alt"></i></div>
      </div>
    </aside>

    <main class="main-content" id="mainContent">
      <div id="page-library" class="page active">
        <h2 id="libraryTitle"><i class="fas fa-photo-video"></i> Tất cả</h2>
        <div class="filter-tabs" id="filterTabs">
          <span class="filter-tab active" data-type="all">Tất cả</span>
          <span class="filter-tab" data-type="image">🖼️ Ảnh</span>
          <span class="filter-tab" data-type="video">🎬 Video</span>
        </div>
        <select id="folderSelectMobile" class="folder-select-mobile"></select>
        <div class="folder-tabs-desktop" id="folderTabsDesktop"></div>
        <div class="gallery" id="mediaGallery"></div>
      </div>

      <div id="page-upload" class="page">
        <h2><i class="fas fa-cloud-upload-alt"></i> Tải lên</h2>
        <div class="upload-zone" id="uploadZone">
          <i class="fas fa-cloud-upload-alt fa-2x"></i>
          <div>Nhấn để chọn nhiều ảnh / video</div>
        </div>
        <input type="file" id="fileInput" accept="image/*,video/*" multiple style="display:none;">
        <div class="file-list" id="fileList"></div>
        <div style="display:flex; gap:0.5rem; align-items:center; margin-top:0.5rem;">
          <select id="uploadFolderSelect" style="flex:1; padding:0.7rem; background:var(--bg-card); border:1px solid var(--border); border-radius:0.8rem; color:white;">
            <option value="">-- Thư mục gốc --</option>
          </select>
          <button id="uploadBtn" style="padding:0.7rem 1.5rem; background:var(--accent); border:none; border-radius:0.8rem; color:white; font-weight:600; cursor:pointer;">Upload All</button>
        </div>
        <div id="uploadStatus" class="upload-status" style="margin-top:0.5rem;"></div>
        <div class="progress-bar" id="uploadProgressBar"><div class="progress" id="uploadProgress"></div></div>
      </div>
    </main>
  </div>
  <div class="bottom-nav">
    <div class="nav-item active" data-page="library"><i class="fas fa-images"></i><span>Thư viện</span></div>
    <div class="nav-item" data-page="upload"><i class="fas fa-upload"></i><span>Tải lên</span></div>
    <div class="nav-item" id="mobileLogout"><i class="fas fa-sign-out-alt"></i><span>Thoát</span></div>
  </div>
</div>

<div class="viewer-overlay" id="viewerOverlay">
  <button class="viewer-close" id="viewerClose"><i class="fas fa-times"></i></button>
  <button class="viewer-nav viewer-prev" id="viewerPrev"><i class="fas fa-chevron-left"></i></button>
  <button class="viewer-nav viewer-next" id="viewerNext"><i class="fas fa-chevron-right"></i></button>
  <div class="viewer-counter" id="viewerCounter">1/10</div>
  <div class="viewer-content" id="viewerContent"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/js-sha256/0.9.0/sha256.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<script>
  (() => {
    if (location.protocol === 'file:') {
      document.body.innerHTML = '<div style="color:white;text-align:center;padding:2rem;">Vui lòng dùng Live Server.</div>';
      return;
    }

    firebase.initializeApp({
      apiKey: "AIzaSyBG7rSMk9FqD9GgNYwApXlsPBnxeyZi8qU",
      authDomain: "xyzweb-906a1.firebaseapp.com",
      projectId: "xyzweb-906a1",
      storageBucket: "xyzweb-906a1.firebasestorage.app",
      messagingSenderId: "268520089231",
      appId: "1:268520089231:web:f9fcf91be875cda72272fa"
    });
    const db = firebase.firestore();
    const CLOUD_NAME = "diiwvsz3o", UPLOAD_PRESET = "xyzweb";

    let currentUser = null, currentFolderId = null, foldersCache = [], allMediaCache = [];
    let mediaFilterType = 'all';
    const $ = s => document.querySelector(s), $$ = s => document.querySelectorAll(s);

    const authPage = $('#authPage'), appMain = $('#appMain');
    const loginForm = $('#loginForm'), registerForm = $('#registerForm');
    const loginUsername = $('#loginUsername'), loginPassword = $('#loginPassword'), loginBtn = $('#loginBtn'), loginError = $('#loginError');
    const regUsername = $('#regUsername'), regPassword = $('#regPassword'), regConfirm = $('#regConfirm'), registerBtn = $('#registerBtn'), registerError = $('#registerError');
    const showRegister = $('#showRegister'), showLogin = $('#showLogin');
    const displayUser = $('#displayUser'), logoutBtn = $('#logoutBtn'), mobileLogout = $('#mobileLogout');

    const sidebar = $('#sidebar'), mobileMenuBtn = $('#mobileMenuBtn'), sidebarCloseMobile = $('#sidebarCloseMobile');
    const folderList = $('#folderList'), folderTabsDesktop = $('#folderTabsDesktop'), folderSelectMobile = $('#folderSelectMobile');
    const uploadFolderSelect = $('#uploadFolderSelect'), mediaGallery = $('#mediaGallery'), libraryTitle = $('#libraryTitle');
    const newFolderName = $('#newFolderName'), createFolderBtn = $('#createFolderBtn');
    const fileInput = $('#fileInput'), fileListDiv = $('#fileList'), uploadBtn = $('#uploadBtn'), uploadStatus = $('#uploadStatus');
    const uploadProgressFill = $('#uploadProgress');
    const viewerOverlay = $('#viewerOverlay'), viewerContent = $('#viewerContent'), viewerClose = $('#viewerClose');
    const viewerPrev = $('#viewerPrev'), viewerNext = $('#viewerNext'), viewerCounter = $('#viewerCounter');
    const filterTabs = $('#filterTabs');

    mobileMenuBtn.addEventListener('click', () => sidebar.classList.add('open'));
    sidebarCloseMobile.addEventListener('click', () => sidebar.classList.remove('open'));
    $('#mainContent').addEventListener('click', () => { if (window.innerWidth <= 768) sidebar.classList.remove('open'); });

    function hash(p, s) { return sha256(p + s); }

    showRegister.onclick = () => { loginForm.classList.add('hidden'); registerForm.classList.remove('hidden'); loginError.textContent=''; registerError.textContent=''; };
    showLogin.onclick = () => { registerForm.classList.add('hidden'); loginForm.classList.remove('hidden'); loginError.textContent=''; registerError.textContent=''; };

    registerBtn.onclick = async () => {
      const u = regUsername.value.trim(), p = regPassword.value, c = regConfirm.value;
      if(!u||!p||!c) { registerError.textContent='Vui lòng điền đầy đủ.'; return; }
      if(p.length<4) { registerError.textContent='Mật khẩu tối thiểu 4 ký tự.'; return; }
      if(p!==c) { registerError.textContent='Xác nhận không khớp.'; return; }
      try {
        const doc = await db.collection('users').doc(u).get();
        if(doc.exists) { registerError.textContent='Tên đăng nhập đã tồn tại.'; return; }
        await db.collection('users').doc(u).set({
          username: u, passwordHash: hash(p, u+'vault_salt'),
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        regUsername.value=''; regPassword.value=''; regConfirm.value='';
        registerForm.classList.add('hidden'); loginForm.classList.remove('hidden');
        loginError.textContent='Đăng ký thành công!';
      } catch(e) { registerError.textContent = 'Lỗi: '+e.message; }
    };

    loginBtn.onclick = async () => {
      const u = loginUsername.value.trim(), p = loginPassword.value;
      if(!u||!p) { loginError.textContent='Vui lòng nhập đầy đủ.'; return; }
      try {
        const doc = await db.collection('users').doc(u).get();
        if(!doc.exists) { loginError.textContent='Tài khoản không tồn tại.'; return; }
        if(hash(p, u+'vault_salt') === doc.data().passwordHash) {
          currentUser = u;
          localStorage.setItem('vaultUser', u);
          displayUser.textContent = u;
          authPage.classList.add('hidden');
          appMain.classList.remove('hidden');
          await loadFolders();
          await loadAllMedia();
          applyFilter();
          loginUsername.value=''; loginPassword.value='';
        } else { loginError.textContent='Sai mật khẩu.'; }
      } catch(e) { loginError.textContent = 'Lỗi: '+e.message; }
    };

    function logout() {
      currentUser = null;
      localStorage.removeItem('vaultUser');
      authPage.classList.remove('hidden');
      appMain.classList.add('hidden');
      loginForm.classList.remove('hidden'); registerForm.classList.add('hidden');
      loginError.textContent=''; registerError.textContent='';
      allMediaCache = []; foldersCache = [];
      sidebar.classList.remove('open');
    }
    logoutBtn.onclick = logout; mobileLogout.onclick = logout;

    async function checkSession() {
      const saved = localStorage.getItem('vaultUser');
      if(saved) {
        const doc = await db.collection('users').doc(saved).get();
        if(doc.exists) {
          currentUser = saved;
          displayUser.textContent = saved;
          authPage.classList.add('hidden'); appMain.classList.remove('hidden');
          await loadFolders();
          await loadAllMedia();
          applyFilter();
          return;
        }
      }
      authPage.classList.remove('hidden'); appMain.classList.add('hidden');
    }

    function switchPage(page) {
      $$('.page').forEach(p => p.classList.remove('active'));
      $('#page-'+page).classList.add('active');
      $$('.nav-item').forEach(i => i.classList.remove('active'));
      document.querySelectorAll(`.nav-item[data-page="${page}"]`).forEach(el => el.classList.add('active'));
      if (window.innerWidth <= 768) sidebar.classList.remove('open');
    }
    $$('.nav-item[data-page]').forEach(el => el.onclick = () => switchPage(el.dataset.page));

    async function loadFolders() {
      const snap = await db.collection('users').doc(currentUser).collection('folders').orderBy('name').get();
      foldersCache = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderFolders();
    }

    function renderFolders() {
      folderList.innerHTML = '';
      folderTabsDesktop.innerHTML = '<span class="folder-tab active" data-folder="">Tất cả</span>';
      folderSelectMobile.innerHTML = '<option value="">Tất cả</option>';
      uploadFolderSelect.innerHTML = '<option value="">-- Thư mục gốc --</option>';
      foldersCache.forEach(f => {
        folderList.innerHTML += `
          <div class="folder-item" data-folder="${f.id}">
            <i class="fas fa-folder"></i> <span class="folder-name">${f.name}</span>
            <div class="folder-actions">
              <button class="rename-folder-btn" data-id="${f.id}" data-name="${f.name}" title="Đổi tên"><i class="fas fa-pen"></i></button>
              <button class="delete-folder-btn" data-id="${f.id}" data-name="${f.name}" title="Xóa"><i class="fas fa-trash-alt"></i></button>
            </div>
          </div>`;
        folderTabsDesktop.innerHTML += `<span class="folder-tab" data-folder="${f.id}">${f.name}</span>`;
        folderSelectMobile.innerHTML += `<option value="${f.id}">${f.name}</option>`;
        uploadFolderSelect.innerHTML += `<option value="${f.id}">${f.name}</option>`;
      });

      document.querySelectorAll('.folder-item').forEach(el => {
        el.addEventListener('click', (e) => {
          if (e.target.closest('.folder-actions')) return;
          currentFolderId = el.dataset.folder;
          libraryTitle.innerHTML = `<i class="fas fa-folder-open"></i> ${el.querySelector('.folder-name').textContent}`;
          switchPage('library');
          applyFilter();
          highlightFolder(el.dataset.folder);
        });
      });

      document.querySelectorAll('.rename-folder-btn').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          e.stopPropagation();
          const folderId = btn.dataset.id;
          const oldName = btn.dataset.name;
          const newName = prompt('Nhập tên mới:', oldName);
          if (newName && newName.trim() !== '' && newName.trim() !== oldName) {
            await db.collection('users').doc(currentUser).collection('folders').doc(folderId).update({ name: newName.trim() });
            loadFolders();
          }
        });
      });

      document.querySelectorAll('.delete-folder-btn').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          e.stopPropagation();
          const folderId = btn.dataset.id;
          const folderName = btn.dataset.name;
          if (confirm(`Xóa thư mục "${folderName}"? Các ảnh/video sẽ về thư mục gốc.`)) {
            await db.collection('users').doc(currentUser).collection('folders').doc(folderId).delete();
            allMediaCache = allMediaCache.map(m => m.folder_id === folderId ? {...m, folder_id: null} : m);
            loadFolders();
            applyFilter();
          }
        });
      });

      document.querySelectorAll('.folder-tab').forEach(tab => tab.onclick = () => {
        const fid = tab.dataset.folder || null;
        currentFolderId = fid;
        libraryTitle.innerHTML = fid ? `<i class="fas fa-folder-open"></i> ${tab.textContent}` : '<i class="fas fa-photo-video"></i> Tất cả';
        document.querySelectorAll('.folder-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        folderSelectMobile.value = fid || '';
        applyFilter();
      });

      folderSelectMobile.onchange = () => {
        const val = folderSelectMobile.value;
        currentFolderId = val || null;
        libraryTitle.innerHTML = val ? `<i class="fas fa-folder-open"></i> ${folderSelectMobile.options[folderSelectMobile.selectedIndex].text}` : '<i class="fas fa-photo-video"></i> Tất cả';
        applyFilter();
      };
    }

    function highlightFolder(fid) {
      document.querySelectorAll('.folder-item').forEach(el => el.classList.remove('active'));
      if(fid) document.querySelector(`.folder-item[data-folder="${fid}"]`)?.classList.add('active');
    }

    createFolderBtn.onclick = async () => {
      const name = newFolderName.value.trim();
      if(!name) return;
      await db.collection('users').doc(currentUser).collection('folders').add({ name });
      newFolderName.value = '';
      loadFolders();
    };

    async function loadAllMedia() {
      const snap = await db.collection('users').doc(currentUser).collection('media').orderBy('created_at', 'desc').get();
      allMediaCache = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    }

    function applyFilter() {
      let filtered = allMediaCache;
      if (currentFolderId) {
        filtered = filtered.filter(m => m.folder_id === currentFolderId);
      }
      if (mediaFilterType === 'image') {
        filtered = filtered.filter(m => m.resource_type === 'image');
      } else if (mediaFilterType === 'video') {
        filtered = filtered.filter(m => m.resource_type === 'video');
      }
      const images = filtered.filter(m => m.resource_type === 'image');
      const videos = filtered.filter(m => m.resource_type === 'video');
      const sorted = [...images, ...videos];
      renderMedia(sorted);
    }

    filterTabs.querySelectorAll('.filter-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        filterTabs.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        mediaFilterType = tab.dataset.type;
        applyFilter();
      });
    });

    function getThumbnailUrl(file) {
      if (file.resource_type === 'video' && file.public_id) {
        return `https://res.cloudinary.com/${CLOUD_NAME}/video/upload/so_1,f_jpg,w_400,h_300,c_fill/${file.public_id}.jpg`;
      }
      return file.url;
    }

    let filesToUpload = [];
    fileInput.addEventListener('change', () => {
      filesToUpload = Array.from(fileInput.files);
      renderFileList();
    });

    function renderFileList() {
      fileListDiv.innerHTML = '';
      if (filesToUpload.length === 0) {
        fileListDiv.innerHTML = '<div class="file-item"><i class="far fa-file"></i> Chưa có tệp</div>';
        return;
      }
      filesToUpload.forEach((file) => {
        const div = document.createElement('div');
        div.className = 'file-item';
        div.innerHTML = `<i class="far fa-file"></i> ${file.name} <span style="margin-left:auto;color:var(--text-secondary);">${(file.size/1024/1024).toFixed(1)} MB</span>`;
        fileListDiv.appendChild(div);
      });
    }

    uploadBtn.onclick = async () => {
      if (filesToUpload.length === 0) {
        uploadStatus.textContent = 'Vui lòng chọn ít nhất một tệp.';
        return;
      }
      uploadBtn.disabled = true;
      uploadStatus.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Đang tải...';
      uploadProgressFill.style.width = '0%';
      let successCount = 0;
      let skipCount = 0;
      const errorFiles = [];
      const total = filesToUpload.length;
      const folderId = uploadFolderSelect.value || null;
      for (let i = 0; i < total; i++) {
        const file = filesToUpload[i];
        // Kiểm tra trùng
        const isDuplicate = allMediaCache.some(m => m.original_name === file.name && m.size === file.size);
        if (isDuplicate) {
          skipCount++;
          uploadProgressFill.style.width = Math.round(((i+1)/total)*100) + '%';
          continue;
        }
        uploadStatus.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Đang tải ${file.name} (${i+1}/${total})`;
        try {
          const fd = new FormData();
          fd.append('file', file);
          fd.append('upload_preset', UPLOAD_PRESET);
          const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/auto/upload`, { method:'POST', body:fd });
          const data = await res.json();
          if (data.error) throw new Error(data.error.message);
          await db.collection('users').doc(currentUser).collection('media').add({
            url: data.secure_url, public_id: data.public_id, resource_type: data.resource_type,
            original_name: file.name, size: data.bytes, folder_id: folderId,
            created_at: firebase.firestore.FieldValue.serverTimestamp()
          });
          successCount++;
        } catch(e) {
          errorFiles.push(file.name);
          console.error('Upload error:', file.name, e);
        }
        uploadProgressFill.style.width = Math.round(((i+1)/total)*100) + '%';
      }
      uploadProgressFill.style.width = '100%';
      let msg = '';
      if (successCount > 0) msg += `✅ Thành công: ${successCount}/${total} tệp. `;
      if (skipCount > 0) msg += `⏭️ Bỏ qua (trùng): ${skipCount} tệp. `;
      if (errorFiles.length > 0) msg += `❌ Lỗi: ${errorFiles.join(', ')}`;
      if (!msg) msg = 'Không có tệp nào được tải.';
      uploadStatus.innerHTML = msg;
      uploadBtn.disabled = false;
      fileInput.value = '';
      filesToUpload = [];
      renderFileList();
      await loadAllMedia();
      applyFilter();
      loadFolders();
    };

    const uploadZone = $('#uploadZone');
    uploadZone.addEventListener('click', () => fileInput.click());
    uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.style.borderColor='var(--accent)'; });
    uploadZone.addEventListener('dragleave', () => uploadZone.style.borderColor='');
    uploadZone.addEventListener('drop', e => {
      e.preventDefault();
      uploadZone.style.borderColor='';
      if (e.dataTransfer.files.length) {
        filesToUpload = Array.from(e.dataTransfer.files);
        renderFileList();
      }
    });

    function renderMedia(files) {
      mediaGallery.innerHTML = '';
      if(!files.length) {
        mediaGallery.innerHTML = '<div style="text-align:center;color:var(--text-secondary);padding:2rem;"><i class="fas fa-inbox fa-2x"></i><p>Trống</p></div>';
        return;
      }
      const frag = document.createDocumentFragment();
      files.forEach((file, index) => {
        const isVideo = file.resource_type === 'video';
        const card = document.createElement('div');
        card.className = 'media-card' + (isVideo ? ' video-thumb' : ' image-thumb');
        card.dataset.index = index;
        const img = document.createElement('img');
        img.src = getThumbnailUrl(file);
        img.alt = file.original_name || '';
        img.loading = 'lazy';
        img.onerror = () => { img.src = 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150"><rect fill="%231e2538" width="200" height="150"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="%239aa4bf">?</text></svg>'; };
        card.appendChild(img);
        const delBtn = document.createElement('button');
        delBtn.className = 'delete-btn';
        delBtn.innerHTML = '<i class="fas fa-trash-alt"></i>';
        delBtn.onclick = async (e) => {
          e.stopPropagation();
          if(!confirm('Xóa?')) return;
          if(file.public_id) await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/delete_by_token`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ token: file.public_id }) });
          await db.collection('users').doc(currentUser).collection('media').doc(file.id).delete();
          allMediaCache = allMediaCache.filter(m => m.id !== file.id);
          applyFilter();
        };
        card.appendChild(delBtn);
        const typeIcon = document.createElement('div');
        typeIcon.className = 'media-type-icon';
        typeIcon.innerHTML = isVideo ? '<i class="fas fa-play"></i>' : '';
        card.appendChild(typeIcon);
        card.addEventListener('click', () => openViewer(files, index));
        frag.appendChild(card);
      });
      mediaGallery.appendChild(frag);
    }

    let viewerFiles = [], viewerIndex = 0;
    let touchStartX = 0, touchDist = 0, isDragging = false;
    let hideControlsTimer;

    function openViewer(files, index) {
      viewerFiles = files;
      viewerIndex = index;
      viewerOverlay.classList.add('active');
      viewerOverlay.classList.add('interacting');
      clearTimeout(hideControlsTimer);
      hideControlsTimer = setTimeout(() => viewerOverlay.classList.remove('interacting'), 3000);
      updateViewer();
    }

    function closeViewer() {
      viewerOverlay.classList.remove('active');
      viewerContent.innerHTML = '';
      clearTimeout(hideControlsTimer);
    }

    viewerClose.onclick = closeViewer;
    viewerOverlay.addEventListener('click', (e) => { if (e.target === viewerOverlay) closeViewer(); });
    viewerContent.addEventListener('click', () => {
      viewerOverlay.classList.add('interacting');
      clearTimeout(hideControlsTimer);
      hideControlsTimer = setTimeout(() => viewerOverlay.classList.remove('interacting'), 3000);
    });

    function updateViewer() {
      const file = viewerFiles[viewerIndex];
      viewerContent.innerHTML = '';
      const isVideo = file.resource_type === 'video';
      let media;
      if (isVideo) {
        media = document.createElement('video');
        media.src = file.url;
        media.controls = true;
        media.autoplay = true;
        media.playsInline = true;
      } else {
        media = document.createElement('img');
        media.src = file.url;
      }
      media.className = 'viewer-media';
      media.setAttribute('draggable', 'false');
      viewerContent.appendChild(media);
      viewerCounter.textContent = `${viewerIndex+1}/${viewerFiles.length}`;

      media.addEventListener('touchstart', e => {
        touchStartX = e.touches[0].clientX;
        media.style.transition = 'none';
        isDragging = true;
      });
      media.addEventListener('touchmove', e => {
        if (!isDragging) return;
        touchDist = e.touches[0].clientX - touchStartX;
        media.style.transform = `translateX(${touchDist}px)`;
      });
      media.addEventListener('touchend', () => {
        if (!isDragging) return;
        isDragging = false;
        media.style.transition = 'transform 0.2s ease-out';
        if (Math.abs(touchDist) > 60) {
          if (touchDist < 0 && viewerIndex < viewerFiles.length-1) viewerIndex++;
          else if (touchDist > 0 && viewerIndex > 0) viewerIndex--;
        }
        media.style.transform = 'translateX(0)';
        updateViewer();
      });
    }

    viewerPrev.onclick = () => { if(viewerIndex>0) { viewerIndex--; updateViewer(); } };
    viewerNext.onclick = () => { if(viewerIndex<viewerFiles.length-1) { viewerIndex++; updateViewer(); } };
    document.addEventListener('keydown', e => {
      if(viewerOverlay.classList.contains('active')) {
        if(e.key === 'ArrowLeft') viewerPrev.click();
        if(e.key === 'ArrowRight') viewerNext.click();
        if(e.key === 'Escape') closeViewer();
      }
    });

    checkSession();
  })();
</script>
</body>
</html>
