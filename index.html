<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>📁 Vault - Kho lưu trữ cá nhân</title>
  <!-- Font Awesome 6 cho icon đẹp -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    :root {
      --bg-primary: #0b0f19;
      --bg-secondary: #151b28;
      --bg-card: #1e2538;
      --bg-input: #252d3f;
      --text-primary: #eef2f7;
      --text-secondary: #9aa4bf;
      --accent: #4f8cff;
      --accent-hover: #3a6fd8;
      --danger: #f87171;
      --danger-hover: #ef4444;
      --border: rgba(255,255,255,0.08);
      --shadow: 0 8px 32px rgba(0,0,0,0.4);
      --radius: 1rem;
      --transition: 0.2s cubic-bezier(0.23, 1, 0.32, 1);
    }
    body {
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    .app-layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }
    /* Sidebar trái */
    .sidebar {
      width: 280px;
      background: rgba(18, 24, 40, 0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 1.5rem 1rem;
      z-index: 10;
      transition: transform 0.3s ease;
    }
    .sidebar-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 2rem;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: white;
    }
    .sidebar-header i {
      font-size: 2rem;
      color: var(--accent);
    }
    .nav-menu {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.85rem 1rem;
      border-radius: 0.9rem;
      cursor: pointer;
      color: var(--text-secondary);
      font-weight: 500;
      transition: all var(--transition);
      position: relative;
    }
    .nav-item i {
      font-size: 1.2rem;
      width: 24px;
      text-align: center;
    }
    .nav-item:hover {
      background: rgba(255,255,255,0.05);
      color: white;
    }
    .nav-item.active {
      background: var(--accent);
      color: white;
      box-shadow: 0 8px 16px -4px rgba(79,140,255,0.3);
    }
    .folders-section {
      margin-top: 1.5rem;
      flex: 1;
      overflow-y: auto;
    }
    .folders-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--text-secondary);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 0.8rem;
      padding: 0 0.5rem;
    }
    .folder-list {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }
    .folder-item {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      padding: 0.7rem 0.8rem;
      border-radius: 0.8rem;
      cursor: pointer;
      color: var(--text-secondary);
      font-size: 0.95rem;
      transition: all var(--transition);
    }
    .folder-item i {
      font-size: 1rem;
      color: #fbbf24;
    }
    .folder-item:hover {
      background: rgba(255,255,255,0.04);
      color: white;
    }
    .folder-item.active {
      background: rgba(79,140,255,0.15);
      color: white;
    }
    .add-folder {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }
    .add-folder input {
      flex: 1;
      padding: 0.6rem 0.8rem;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 0.8rem;
      color: white;
      outline: none;
      font-size: 0.9rem;
      transition: border var(--transition);
    }
    .add-folder input:focus {
      border-color: var(--accent);
    }
    .add-folder button {
      padding: 0.6rem 1rem;
      background: var(--accent);
      border: none;
      border-radius: 0.8rem;
      color: white;
      cursor: pointer;
      font-weight: 600;
      transition: background var(--transition);
    }
    .add-folder button:hover {
      background: var(--accent-hover);
    }
    .sidebar-footer {
      margin-top: auto;
      border-top: 1px solid var(--border);
      padding-top: 1rem;
      display: flex;
      align-items: center;
      gap: 0.8rem;
      color: var(--text-secondary);
      font-size: 0.9rem;
    }
    .sidebar-footer i {
      font-size: 1.2rem;
      color: var(--text-secondary);
    }
    .logout-btn-sidebar {
      margin-left: auto;
      color: var(--danger);
      cursor: pointer;
      font-size: 1.2rem;
      padding: 0.4rem;
      border-radius: 0.6rem;
      transition: background var(--transition);
    }
    .logout-btn-sidebar:hover {
      background: rgba(248,113,113,0.15);
    }

    /* Nội dung chính */
    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: 2rem;
      background: var(--bg-secondary);
      transition: padding 0.3s;
    }
    .page {
      display: none;
      animation: fadeSlide 0.25s ease;
    }
    .page.active {
      display: block;
    }
    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Auth page */
    .auth-container {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at top, #1e293b, #0b0f19);
    }
    .auth-box {
      background: rgba(30,37,56,0.8);
      backdrop-filter: blur(24px);
      border: 1px solid var(--border);
      padding: 2.5rem;
      border-radius: 2rem;
      width: 100%;
      max-width: 420px;
      box-shadow: var(--shadow);
      transition: transform 0.2s;
    }
    .auth-box h2 {
      font-size: 1.8rem;
      margin-bottom: 0.3rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 700;
    }
    .auth-sub {
      color: var(--text-secondary);
      margin-bottom: 2rem;
      font-size: 0.9rem;
    }
    .auth-box input {
      width: 100%;
      padding: 0.9rem 1rem;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 1rem;
      margin-bottom: 1rem;
      color: white;
      font-size: 1rem;
      outline: none;
      transition: border var(--transition);
    }
    .auth-box input:focus {
      border-color: var(--accent);
    }
    .auth-box button {
      width: 100%;
      padding: 0.9rem;
      background: var(--accent);
      border: none;
      border-radius: 1rem;
      color: white;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      margin-bottom: 0.7rem;
      transition: background var(--transition);
    }
    .auth-box button:hover {
      background: var(--accent-hover);
    }
    .auth-toggle {
      text-align: center;
      color: var(--text-secondary);
      margin-top: 1rem;
      font-size: 0.9rem;
    }
    .auth-toggle span {
      color: var(--accent);
      cursor: pointer;
      font-weight: 500;
    }
    .error-msg {
      color: var(--danger);
      font-size: 0.85rem;
      margin-top: 0.4rem;
      min-height: 1.2rem;
    }

    /* Upload area */
    .upload-zone {
      border: 2px dashed rgba(255,255,255,0.2);
      border-radius: 1.2rem;
      padding: 2.5rem;
      text-align: center;
      cursor: pointer;
      transition: all var(--transition);
      background: rgba(255,255,255,0.02);
      margin: 1rem 0;
    }
    .upload-zone:hover {
      border-color: var(--accent);
      background: rgba(79,140,255,0.04);
    }
    .upload-zone i {
      font-size: 2.5rem;
      color: var(--text-secondary);
      margin-bottom: 0.5rem;
    }

    /* Gallery */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1.2rem;
      margin-top: 1.5rem;
    }
    .media-card {
      background: var(--bg-card);
      border-radius: 1.2rem;
      overflow: hidden;
      border: 1px solid var(--border);
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
    }
    .media-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 24px rgba(0,0,0,0.3);
    }
    .media-card img, .media-card video {
      width: 100%;
      height: 160px;
      object-fit: cover;
      display: block;
      background: #0f1320;
    }
    .media-card video {
      background: black;
    }
    .media-info {
      padding: 0.7rem 0.9rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--text-secondary);
    }
    .media-info span {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 70%;
    }
    .delete-media-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 0.4rem;
      border-radius: 0.5rem;
      transition: all var(--transition);
    }
    .delete-media-btn:hover {
      color: var(--danger);
      background: rgba(248,113,113,0.15);
    }

    /* Folder tabs */
    .folder-tabs {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 1.2rem;
    }
    .folder-tab {
      padding: 0.5rem 1.2rem;
      border-radius: 2rem;
      background: rgba(255,255,255,0.05);
      cursor: pointer;
      font-size: 0.9rem;
      color: var(--text-secondary);
      transition: all var(--transition);
    }
    .folder-tab.active {
      background: var(--accent);
      color: white;
    }

    /* Status messages */
    .status-msg {
      font-size: 0.9rem;
      margin-top: 0.4rem;
    }

    /* Mobile bottom nav */
    .bottom-nav {
      display: none;
      background: var(--bg-secondary);
      border-top: 1px solid var(--border);
      padding: 0.5rem 1rem;
      justify-content: space-around;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 20;
    }
    .bottom-nav .nav-item {
      flex-direction: column;
      gap: 0.2rem;
      font-size: 0.7rem;
      color: var(--text-secondary);
    }
    .bottom-nav .nav-item i {
      font-size: 1.2rem;
    }
    .bottom-nav .nav-item.active {
      color: var(--accent);
      background: transparent;
      box-shadow: none;
    }

    @media (max-width: 768px) {
      .sidebar {
        display: none;
      }
      .main-content {
        padding: 1rem;
        padding-bottom: 4rem;
      }
      .bottom-nav {
        display: flex;
      }
      .gallery {
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      }
    }
    .hidden {
      display: none !important;
    }
    .text-center { text-align: center; }
    .my-2 { margin: 1rem 0; }
    /* Skeleton loading */
    .skeleton {
      background: linear-gradient(90deg, var(--bg-card) 25%, #2a3245 50%, var(--bg-card) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 1rem;
      height: 180px;
    }
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
  </style>
</head>
<body>
<!-- Auth Page -->
<div id="authPage" class="auth-container">
  <div class="auth-box" id="loginForm">
    <h2><i class="fas fa-lock"></i> Đăng nhập</h2>
    <p class="auth-sub">Truy cập kho lưu trữ của bạn</p>
    <input type="text" id="loginUsername" placeholder="Tên đăng nhập" autocomplete="off">
    <input type="password" id="loginPassword" placeholder="Mật khẩu">
    <button id="loginBtn"><i class="fas fa-sign-in-alt"></i> Đăng nhập</button>
    <div class="auth-toggle">Chưa có tài khoản? <span id="showRegister">Đăng ký</span></div>
    <div id="loginError" class="error-msg"></div>
  </div>
  <div class="auth-box hidden" id="registerForm">
    <h2><i class="fas fa-user-plus"></i> Đăng ký</h2>
    <p class="auth-sub">Tạo tài khoản mới miễn phí</p>
    <input type="text" id="regUsername" placeholder="Tên đăng nhập">
    <input type="password" id="regPassword" placeholder="Mật khẩu (≥ 4 ký tự)">
    <input type="password" id="regConfirm" placeholder="Xác nhận mật khẩu">
    <button id="registerBtn"><i class="fas fa-check"></i> Tạo tài khoản</button>
    <div class="auth-toggle">Đã có tài khoản? <span id="showLogin">Đăng nhập</span></div>
    <div id="registerError" class="error-msg"></div>
  </div>
</div>

<!-- App chính -->
<div id="appMain" class="hidden" style="display:flex; flex-direction:column; height:100vh;">
  <div class="app-layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <i class="fas fa-cloud-upload-alt"></i> Vault
      </div>
      <nav class="nav-menu">
        <div class="nav-item active" data-page="library">
          <i class="fas fa-images"></i> Thư viện
        </div>
        <div class="nav-item" data-page="upload">
          <i class="fas fa-upload"></i> Tải lên
        </div>
      </nav>
      <div class="folders-section">
        <div class="folders-title">
          <span>📁 Thư mục</span>
        </div>
        <div class="folder-list" id="folderList"></div>
        <div class="add-folder">
          <input type="text" id="newFolderName" placeholder="Tên thư mục mới...">
          <button id="createFolderBtn"><i class="fas fa-plus"></i></button>
        </div>
      </div>
      <div class="sidebar-footer">
        <i class="fas fa-user-circle"></i> <span id="displayUser"></span>
        <div class="logout-btn-sidebar" id="logoutBtn" title="Đăng xuất">
          <i class="fas fa-sign-out-alt"></i>
        </div>
      </div>
    </aside>

    <!-- Main -->
    <main class="main-content">
      <!-- Page Library -->
      <div id="page-library" class="page active">
        <h2 id="libraryTitle" style="display:flex; align-items:center; gap:0.5rem;">
          <i class="fas fa-photo-video"></i> Tất cả
        </h2>
        <div class="folder-tabs" id="folderTabs">
          <span class="folder-tab active" data-folder="">Tất cả</span>
        </div>
        <div class="gallery" id="mediaGallery"></div>
      </div>

      <!-- Page Upload -->
      <div id="page-upload" class="page">
        <h2><i class="fas fa-cloud-upload-alt"></i> Tải ảnh / video lên</h2>
        <div id="uploadZone" class="upload-zone" onclick="document.getElementById('fileInput').click()">
          <i class="fas fa-cloud-upload-alt"></i>
          <div style="font-weight:600;">Nhấn để chọn tệp</div>
          <div style="font-size:0.8rem; color:var(--text-secondary);">Hoặc kéo thả vào đây</div>
        </div>
        <input type="file" id="fileInput" accept="image/*,video/*" style="display:none;">
        <div id="fileName" style="margin:0.5rem 0; color:var(--text-secondary);"><i class="far fa-file"></i> Chưa có tệp</div>
        <div style="display:flex; gap:1rem; align-items:center;">
          <select id="uploadFolderSelect" style="flex:1; padding:0.7rem; background:var(--bg-input); border:1px solid var(--border); border-radius:0.8rem; color:white;">
            <option value="">-- Thư mục gốc --</option>
          </select>
          <button id="uploadBtn" style="padding:0.7rem 1.8rem; background:var(--accent); border:none; border-radius:0.8rem; color:white; font-weight:600; cursor:pointer;">
            <i class="fas fa-upload"></i> Upload
          </button>
        </div>
        <div id="uploadStatus" class="status-msg"></div>
      </div>
    </main>
  </div>
  <!-- Bottom nav mobile -->
  <div class="bottom-nav">
    <div class="nav-item active" data-page="library"><i class="fas fa-images"></i><span>Thư viện</span></div>
    <div class="nav-item" data-page="upload"><i class="fas fa-upload"></i><span>Tải lên</span></div>
    <div class="nav-item" id="mobileLogout"><i class="fas fa-sign-out-alt"></i><span>Thoát</span></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/js-sha256/0.9.0/sha256.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<script>
  (() => {
    // Môi trường
    if (location.protocol === 'file:') {
      document.body.innerHTML = '<div style="color:white; text-align:center; padding:2rem;">⚠️ Vui lòng dùng Live Server (VS Code) hoặc GitHub Pages.</div>';
      return;
    }

    // Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyBG7rSMk9FqD9GgNYwApXlsPBnxeyZi8qU",
      authDomain: "xyzweb-906a1.firebaseapp.com",
      databaseURL: "https://xyzweb-906a1-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "xyzweb-906a1",
      storageBucket: "xyzweb-906a1.firebasestorage.app",
      messagingSenderId: "268520089231",
      appId: "1:268520089231:web:f9fcf91be875cda72272fa",
      measurementId: "G-CM4G49WGYD"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    // Không dùng cấu hình đặc biệt

    const CLOUD_NAME = "diiwvsz3o";
    const UPLOAD_PRESET = "xyzweb";

    // State
    let currentUser = null;
    let currentFolderId = null;
    let foldersCache = [];
    let allMediaCache = []; // để lọc nhanh

    // DOM
    const $ = (sel) => document.querySelector(sel);
    const $$ = (sel) => document.querySelectorAll(sel);

    const authPage = $('#authPage');
    const appMain = $('#appMain');
    const loginForm = $('#loginForm');
    const registerForm = $('#registerForm');
    const loginUsername = $('#loginUsername');
    const loginPassword = $('#loginPassword');
    const loginBtn = $('#loginBtn');
    const loginError = $('#loginError');
    const regUsername = $('#regUsername');
    const regPassword = $('#regPassword');
    const regConfirm = $('#regConfirm');
    const registerBtn = $('#registerBtn');
    const registerError = $('#registerError');
    const showRegister = $('#showRegister');
    const showLogin = $('#showLogin');
    const displayUser = $('#displayUser');
    const logoutBtn = $('#logoutBtn');
    const mobileLogout = $('#mobileLogout');
    const folderList = $('#folderList');
    const folderTabs = $('#folderTabs');
    const uploadFolderSelect = $('#uploadFolderSelect');
    const mediaGallery = $('#mediaGallery');
    const libraryTitle = $('#libraryTitle');
    const newFolderName = $('#newFolderName');
    const createFolderBtn = $('#createFolderBtn');
    const fileInput = $('#fileInput');
    const fileName = $('#fileName');
    const uploadBtn = $('#uploadBtn');
    const uploadStatus = $('#uploadStatus');

    // Hash
    function hash(pwd, salt) { return sha256(pwd + salt); }

    // Toggle auth forms
    showRegister.onclick = () => { loginForm.classList.add('hidden'); registerForm.classList.remove('hidden'); loginError.textContent=''; registerError.textContent=''; };
    showLogin.onclick = () => { registerForm.classList.add('hidden'); loginForm.classList.remove('hidden'); loginError.textContent=''; registerError.textContent=''; };

    // Đăng ký
    registerBtn.onclick = async () => {
      const u = regUsername.value.trim(), p = regPassword.value, c = regConfirm.value;
      if(!u||!p||!c) { registerError.textContent='Vui lòng điền đầy đủ.'; return; }
      if(p.length<4) { registerError.textContent='Mật khẩu tối thiểu 4 ký tự.'; return; }
      if(p!==c) { registerError.textContent='Xác nhận mật khẩu không khớp.'; return; }
      try {
        const doc = await db.collection('users').doc(u).get();
        if(doc.exists) { registerError.textContent='Tên đăng nhập đã tồn tại.'; return; }
        await db.collection('users').doc(u).set({
          username: u, passwordHash: hash(p, u+'vault_salt_2025'),
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        regUsername.value=''; regPassword.value=''; regConfirm.value='';
        registerForm.classList.add('hidden'); loginForm.classList.remove('hidden');
        loginError.textContent='Đăng ký thành công! Hãy đăng nhập.';
      } catch(e) {
        registerError.textContent = 'Lỗi: ' + (e.message || 'Không thể kết nối.');
      }
    };

    // Đăng nhập
    loginBtn.onclick = async () => {
      const u = loginUsername.value.trim(), p = loginPassword.value;
      if(!u||!p) { loginError.textContent='Vui lòng nhập đầy đủ.'; return; }
      try {
        const doc = await db.collection('users').doc(u).get();
        if(!doc.exists) { loginError.textContent='Tài khoản không tồn tại.'; return; }
        const data = doc.data();
        if(hash(p, u+'vault_salt_2025') === data.passwordHash) {
          currentUser = u;
          localStorage.setItem('vaultUser', u);
          displayUser.textContent = u;
          authPage.classList.add('hidden');
          appMain.classList.remove('hidden');
          await loadFolders();
          await loadAllMedia();
          applyFolderFilter();
          loginUsername.value=''; loginPassword.value='';
        } else {
          loginError.textContent='Sai mật khẩu.';
        }
      } catch(e) {
        loginError.textContent = 'Lỗi: ' + (e.message || 'Không thể kết nối.');
      }
    };

    // Logout
    function logout() {
      currentUser = null;
      localStorage.removeItem('vaultUser');
      authPage.classList.remove('hidden');
      appMain.classList.add('hidden');
      loginForm.classList.remove('hidden');
      registerForm.classList.add('hidden');
      loginError.textContent=''; registerError.textContent='';
      allMediaCache = [];
      foldersCache = [];
    }
    logoutBtn.onclick = logout;
    mobileLogout.onclick = logout;

    // Kiểm tra phiên
    async function checkSession() {
      const saved = localStorage.getItem('vaultUser');
      if(saved) {
        const doc = await db.collection('users').doc(saved).get();
        if(doc.exists) {
          currentUser = saved;
          displayUser.textContent = saved;
          authPage.classList.add('hidden');
          appMain.classList.remove('hidden');
          await loadFolders();
          await loadAllMedia();
          applyFolderFilter();
          return;
        }
      }
      authPage.classList.remove('hidden');
      appMain.classList.add('hidden');
    }

    // Menu chuyển trang
    function switchPage(page) {
      $$('.page').forEach(p => p.classList.remove('active'));
      $('#page-'+page).classList.add('active');
      $$('.nav-item').forEach(i => i.classList.remove('active'));
      document.querySelectorAll(`.nav-item[data-page="${page}"]`).forEach(el => el.classList.add('active'));
    }
    $$('.nav-item[data-page]').forEach(el => el.onclick = () => switchPage(el.dataset.page));

    // Load folders
    async function loadFolders() {
      try {
        const snap = await db.collection('users').doc(currentUser).collection('folders').orderBy('name').get();
        foldersCache = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      } catch(e) { foldersCache = []; }
      renderFolders();
    }
    function renderFolders() {
      folderList.innerHTML = '';
      folderTabs.innerHTML = '<span class="folder-tab active" data-folder="">Tất cả</span>';
      uploadFolderSelect.innerHTML = '<option value="">-- Thư mục gốc --</option>';
      foldersCache.forEach(f => {
        folderList.innerHTML += `<div class="folder-item" data-folder="${f.id}"><i class="fas fa-folder"></i> ${f.name}</div>`;
        folderTabs.innerHTML += `<span class="folder-tab" data-folder="${f.id}">${f.name}</span>`;
        uploadFolderSelect.innerHTML += `<option value="${f.id}">${f.name}</option>`;
      });
      // Event folder sidebar
      document.querySelectorAll('.folder-item').forEach(el => {
        el.onclick = () => {
          currentFolderId = el.dataset.folder;
          libraryTitle.innerHTML = `<i class="fas fa-folder-open"></i> ${el.textContent.trim()}`;
          switchPage('library');
          applyFolderFilter();
          highlightActiveFolder(el.dataset.folder);
        };
      });
      // Event folder tabs
      document.querySelectorAll('.folder-tab').forEach(tab => {
        tab.onclick = () => {
          const fid = tab.dataset.folder === '' ? null : tab.dataset.folder;
          currentFolderId = fid;
          libraryTitle.innerHTML = fid ? `<i class="fas fa-folder-open"></i> ${tab.textContent}` : `<i class="fas fa-photo-video"></i> Tất cả`;
          document.querySelectorAll('.folder-tab').forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          applyFolderFilter();
        };
      });
    }
    function highlightActiveFolder(fid) {
      document.querySelectorAll('.folder-item').forEach(el => el.classList.remove('active'));
      if(fid) document.querySelector(`.folder-item[data-folder="${fid}"]`)?.classList.add('active');
    }
    createFolderBtn.onclick = async () => {
      const name = newFolderName.value.trim();
      if(!name) return;
      await db.collection('users').doc(currentUser).collection('folders').add({ name });
      newFolderName.value = '';
      loadFolders();
    };

    // Load tất cả media (cache) – tránh query nhiều lần
    async function loadAllMedia() {
      try {
        const snap = await db.collection('users').doc(currentUser).collection('media').orderBy('created_at', 'desc').get();
        allMediaCache = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      } catch(e) {
        console.error('Lỗi tải media:', e);
        allMediaCache = [];
      }
    }

    // Lọc media theo folder hiện tại
    function applyFolderFilter() {
      const filtered = currentFolderId ? allMediaCache.filter(m => m.folder_id === currentFolderId) : allMediaCache;
      renderMedia(filtered);
      // Cập nhật active folder tab nếu cần
      document.querySelectorAll('.folder-tab').forEach(t => t.classList.remove('active'));
      const activeTab = document.querySelector(`.folder-tab[data-folder="${currentFolderId || ''}"]`);
      if(activeTab) activeTab.classList.add('active');
      // Active sidebar folder
      highlightActiveFolder(currentFolderId);
    }

    // Upload
    fileInput.onchange = () => fileName.innerHTML = fileInput.files[0] ? `<i class="far fa-file"></i> ${fileInput.files[0].name}` : '<i class="far fa-file"></i> Chưa có tệp';
    
    uploadBtn.onclick = async () => {
      const file = fileInput.files[0];
      if(!file) { uploadStatus.textContent='Vui lòng chọn tệp'; return; }
      uploadStatus.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Đang tải lên...';
      const formData = new FormData();
      formData.append('file', file);
      formData.append('upload_preset', UPLOAD_PRESET);
      try {
        const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/auto/upload`, { method:'POST', body:formData });
        if(!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        if(data.error) throw new Error(data.error.message);
        const fid = uploadFolderSelect.value || null;
        await db.collection('users').doc(currentUser).collection('media').add({
          url: data.secure_url, public_id: data.public_id, resource_type: data.resource_type,
          original_name: file.name, size: data.bytes, folder_id: fid,
          created_at: firebase.firestore.FieldValue.serverTimestamp()
        });
        uploadStatus.innerHTML = '<i class="fas fa-check-circle" style="color:#4ade80;"></i> Upload thành công!';
        fileInput.value=''; fileName.innerHTML='<i class="far fa-file"></i> Chưa có tệp';
        // Refresh cache
        await loadAllMedia();
        applyFolderFilter();
        await loadFolders();
      } catch(e) {
        uploadStatus.innerHTML = `<i class="fas fa-times-circle" style="color:var(--danger);"></i> Lỗi: ${e.message}`;
      }
    };

    // Render media (đã tối ưu)
    function renderMedia(files) {
      mediaGallery.innerHTML = '';
      if(!files.length) {
        mediaGallery.innerHTML = '<div class="text-center my-2" style="color:var(--text-secondary);"><i class="fas fa-inbox fa-2x"></i><p>Chưa có tệp nào</p></div>';
        return;
      }
      const fragment = document.createDocumentFragment();
      files.forEach(file => {
        const card = document.createElement('div');
        card.className = 'media-card';
        const isVideo = file.resource_type === 'video';
        let mediaEl;
        if(isVideo) {
          mediaEl = document.createElement('video');
          mediaEl.src = file.url;
          mediaEl.controls = true;
          mediaEl.preload = 'metadata';
        } else {
          mediaEl = document.createElement('img');
          mediaEl.src = file.url;
          mediaEl.loading = 'lazy';
        }
        mediaEl.onerror = () => { mediaEl.style.display='none'; card.innerHTML+='<div style="padding:1rem;color:var(--danger);">⚠️ Lỗi tải</div>'; };
        card.appendChild(mediaEl);
        const info = document.createElement('div');
        info.className = 'media-info';
        info.innerHTML = `<span>${file.original_name||'Tệp'}</span>`;
        const del = document.createElement('button');
        del.className = 'delete-media-btn';
        del.innerHTML = '<i class="fas fa-trash-alt"></i>';
        del.title = 'Xóa';
        del.onclick = async (e) => {
          e.stopPropagation();
          if(!confirm('Xóa vĩnh viễn?')) return;
          try {
            if(file.public_id) {
              await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/delete_by_token`, {
                method:'POST', headers:{'Content-Type':'application/json'},
                body: JSON.stringify({ token: file.public_id })
              });
            }
            await db.collection('users').doc(currentUser).collection('media').doc(file.id).delete();
            allMediaCache = allMediaCache.filter(m => m.id !== file.id);
            applyFolderFilter();
          } catch(err) { alert('Lỗi xóa: '+err.message); }
        };
        info.appendChild(del);
        card.appendChild(info);
        fragment.appendChild(card);
      });
      mediaGallery.appendChild(fragment);
    }

    // Kéo thả upload
    const uploadZone = $('#uploadZone');
    if(uploadZone) {
      uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.style.borderColor='var(--accent)'; });
      uploadZone.addEventListener('dragleave', () => uploadZone.style.borderColor='');
      uploadZone.addEventListener('drop', e => {
        e.preventDefault();
        uploadZone.style.borderColor='';
        if(e.dataTransfer.files.length) {
          fileInput.files = e.dataTransfer.files;
          fileName.innerHTML = `<i class="far fa-file"></i> ${fileInput.files[0].name}`;
        }
      });
    }

    // Khởi động
    checkSession();
  })();
</script>
</body>
</html>
